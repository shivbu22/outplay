<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      background: #0B0F19;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1E293B;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.2);
      color: #10B981;
      font-weight: 700;
    }
    .status-card {
      background: #141C2E;
      border: 1px solid #222E46;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 11px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366F1, #4F46E5);
      color: white;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 11px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="header">
    <strong style="font-size: 13px;">AMS Connect</strong>
    <span class="badge">Connected</span>
  </div>
  <div class="status-card">
    <div style="font-weight: bold; margin-bottom: 4px;">Target Workspace:</div>
    <div style="color: #94A3B8;">AMS Outreach (Local Engine)</div>
    <div style="margin-top: 8px; font-weight: bold;">Active Sequence:</div>
    <div style="color: #6366F1;">Enterprise SaaS Outbound Q4</div>
  </div>
  <a href="http://localhost:3000" target="_blank" class="btn">Open AMS Dashboard</a>
</body>
</html>
